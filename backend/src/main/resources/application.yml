# 포르투나볼 AI 설정
# 비밀값(DB 비밀번호, API 키)은 이 파일에 쓰지 않는다. 저장소 루트의 .env 에만 적는다. (.env 는 Git에 올라가지 않음)
spring:
  application:
    name: fortunaball-backend
  config:
    # .env 를 읽는다. IntelliJ 실행 위치가 저장소 루트이든 backend 폴더이든 둘 다 찾는다.
    # 파일이 없어도 오류는 나지 않고, 대신 DB 접속 단계에서 실패하므로 로그에서 바로 알 수 있다.
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  datasource:
    # useSSL=false, allowPublicKeyRetrieval=true 는 내 컴퓨터(로컬) 개발용 설정이다. 배포할 때 다시 점검한다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fortuna_ball}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000      # 5초 안에 연결이 안 되면 바로 실패시켜 원인을 빨리 보게 한다.
  jpa:
    open-in-view: false              # 화면 응답 중 DB 연결을 붙잡지 않는다.
    hibernate:
      ddl-auto: none                 # 테이블은 docs/db/schema.sql 로만 만든다. 자동 생성·변경 금지.
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      # 사진 업로드(당첨 인증 등록) 한도. 기본값 1MB 는 휴대폰 사진에 너무 작아서 올린다.
      max-file-size: ${fortuna.upload.max-size-mb}MB   # 사진 1장 한도. 아래 fortuna.upload.max-size-mb 와 같은 값을 쓴다.
      max-request-size: 12MB                            # 사진 + 글자 칸(댓글 등)을 합친 한도. 사진 한도보다 조금 넉넉히.
  jackson:
    time-zone: Asia/Seoul
  cache:
    type: simple                     # @Cacheable 계열(회차·통계)은 지금처럼 단순 메모리 방식 유지. Caffeine 을 추가해도 자동으로 바뀌지 않게 고정한다.

# 번호 생성 설정 (generate 패키지의 GenerationProperties 가 읽는다)
fortuna:
  # 관리자 설정 (admin.auth.config.AdminProperties 가 읽는다)
  admin:
    login-id: ${ADMIN_LOGIN_ID:}     # 첫 관리자 계정 아이디. .env 의 ADMIN_LOGIN_ID. 관리자가 한 명도 없을 때만 서버 시작 때 만든다.
    password: ${ADMIN_INITIAL_PASSWORD:}   # 첫 관리자 비밀번호(8자 이상). .env 의 ADMIN_INITIAL_PASSWORD. DB 에는 BCrypt 해시만 저장한다.
    max-login-failures: 5            # 한 접속지(IP)에서 이 횟수만큼 틀리면 로그인을 잠시 막는다. (429)
    lock-minutes: 15                 # 막는 시간(분)
  generate:
    ttl-minutes: 30                  # 임시 결과를 보관하는 시간 (분). 이 시간이 지나면 확정할 수 없다.
    max-games: 50                    # 한 번에 만들 수 있는 최대 게임 수 (1~이 값)
    max-issue-per-combo: 3           # 같은 회차에서 같은 조합을 확정 발급할 수 있는 최대 횟수 (이 횟수가 찬 조합은 번호 생성에서 제외)
  # 사진 업로드 (common.file.UploadProperties 가 읽는다)
  upload:
    dir: ${UPLOAD_DIR:}              # 사진 저장 폴더. .env 의 UPLOAD_DIR. 프로젝트(Git) 밖 절대 경로. .env 에서는 \ 대신 / 로 적는다.
    max-size-mb: 10                  # 사진 1장 최대 용량(MB)
  # AI 설정 (ai.client.AiProperties 가 읽는다). 비용 단위는 모두 USD.
  # 한도 숫자는 시연용이다. 실서비스에서는 월 예산에서 거꾸로 계산해서 올린다. (값만 바꾸면 되고 코드는 안 바꾼다)
  ai:
    api-key: ${AI_API_KEY:}          # 비밀값. .env 의 AI_API_KEY 에만 적는다. 비어 있으면 AI 기능만 이용 불가(503), 나머지는 정상.
    base-url: https://api.openai.com/v1
    classifier-model: gpt-6-luna     # 애매한 질문을 나누는 저비용 호출용 모델
    answer-model: gpt-6-luna         # 사용자에게 보여 줄 설명을 만드는 모델. 품질이 부족하면 이 줄만 바꾼다.
    timeout-seconds: 20              # 응답을 기다리는 최대 시간. 넘으면 실패로 처리하고 사용자에게 재시도를 안내한다.
    daily-call-limit: 300            # 서비스 전체 하루 AI 호출 상한(서울 날짜 기준). 넘으면 AI 만 중지(503)
    monthly-cost-limit-usd: 10       # 서비스 전체 월 비용 상한(USD, 매월 1일부터). 넘으면 AI 만 중지(503)
    user-daily-limit: 5              # 비회원 1명(guest_token)의 하루 무료 AI 횟수. 넘으면 429
    ip-daily-limit: 10               # 접속지(IP) 1곳의 하루 AI 횟수. guest_token 을 바꿔 우회하는 것을 막는 안전망
    per-minute-limit: 50             # 1분에 보낼 수 있는 AI 요청 횟수(사용자별·접속지별 각각, 자동 호출 방지용). 일반 사용은 못 느끼는 값. 넘으면 429
    # 모델별 가격(100만 토큰당 USD). 모델을 바꾸면 같이 바꾼다. 비용 추정과 월 한도 계산에 쓴다.
    classifier-input-per-million-usd: 0.10
    classifier-output-per-million-usd: 0.50
    answer-input-per-million-usd: 0.10
    answer-output-per-million-usd: 0.50
  # 조회 횟수 제한 (common.security.RateLimitProperties 가 읽는다)
  rate-limit:
    issue-lookup-per-minute: 30      # 발급코드 상세 조회(API-05)를 한 접속지(IP)에서 1분에 부를 수 있는 횟수. 넘으면 429
    issue-result-per-minute: 30      # 당첨 검증 결과 조회(API-06)를 한 접속지(IP)에서 1분에 부를 수 있는 횟수. 넘으면 429
    ticket-check-per-minute: 30      # 로또 용지 당첨 확인(QR)을 한 접속지(IP)에서 1분에 부를 수 있는 횟수. 넘으면 429
    proof-register-per-minute: 5     # 당첨 인증 등록(API-16)을 한 접속지(IP)에서 1분에 보낼 수 있는 횟수. 사진 처리가 무거워 작게 둔다. 넘으면 429

server:
  port: 8080
  servlet:
    session:
      timeout: 30m                   # 관리자 로그인 세션: 30분 동안 요청이 없으면 로그아웃
      cookie:
        http-only: true              # 화면 스크립트가 세션 쿠키를 읽지 못하게 한다.
        same-site: lax               # 다른 사이트에서 오는 요청에는 세션 쿠키를 보내지 않는다.
        secure: false                # 로컬(http) 개발용. 실서버(https)에서는 true 로 바꾼다. (배포 점검 항목)
  error:
    include-message: never           # 기본 오류 화면에 내부 메시지를 내보내지 않는다.
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.fortunaball: INFO
